function sortChoose(side){

  state.sorter[correctSide].push(pileItem);
  if(!ok && !state.sorter.errors.includes(d.id)) state.sorter.errors.push(d.id);
  state.sorter.index++;

  const checks=[
    {k:'n',ok:a.n===right.n,label:'Форма существительного',right:right.n},
    {k:'type',ok:a.type===right.type,label:'Тип связи',right:d.mode==='u'?'управление':'согласование'},
    {k:'role',ok:a.role===right.role,label:'Вывод о существительном',right:d.mode==='u'?'зависимое от причастия слово':'определяемое слово'},
    {k:'write',ok:a.write===right.write,label:'Написание НЕ',right:d.mode==='u'?'раздельно':'слитно'}
  ];
  const success=checks.every(x=>x.ok);
  if(!state.practice.done[d.id]) state.practice.done[d.id]={success}; else state.practice.done[d.id].success=success;
  if(!success && !state.practice.errors.includes(d.id)) state.practice.errors.push(d.id);
  if(success) state.practice.errors=state.practice.errors.filter(id=>id!==d.id);
  save();
  box.innerHTML=`<div class="status ${success?'good':'bad'}">${success?'✓ Верно!':'Есть неточности.'} ${success?'Цепочка рассуждения собрана правильно.':'Смотри объяснение ниже: оно покажет, что произошло с существительным.'}</div>`;
  const changed=d.mode==='s';
  const typeName=changed?'Согласование':'Управление';
  const roleText=changed?'определяемое слово':'зависимое от причастия слово';
  let table='';
  for(let j=0;j<5;j++) table+=`<div class="case-row"><span class="case-mark">${CASES[j]}</span><span class="case-word"><span class="preposition">${j===4?'о ':''}</span><span class="p">${d.mode==='u'?'не ':'не'}${d.p[j]}</span> <span class="n">${noun(d,j)}</span></span></div>`;
  document.querySelector('#feedback').innerHTML=`<div class="feedback"><h2>Разгадка</h2><div class="feedback-summary"><h3>${changed?'↗ Согласование':'🔒 Управление'}</h3><p>${changed?`Существительное меняется вместе с причастием: <b>${noun(d,0)} → ${noun(d,i)}</b>. <b>Существительное главное</b>, причастие с ним согласуется.`:`Причастие изменило падеж, а существительное сохранило прежнюю форму: <b>${noun(d,0)} → ${noun(d,i)}</b>. <b>Причастие главное</b>, существительное зависит от него и остаётся в винительном падеже.`}</p><div class="verdict"><span class="pill">${typeName}</span><span class="pill">Существительное — ${roleText}</span><span class="pill">НЕ пишем ${changed?'слитно':'раздельно'}</span></div><p><b>Итог:</b> ${formatted(d,0,true)}.</p></div><div class="checklist">${checks.map(x=>`<div class="check ${x.ok?'correct':'incorrect'}"><b>${x.ok?'✓':'✕'} ${x.label}</b>${x.ok?'Верно':'Правильно: '+x.right}</div>`).join('')}</div><div class="review-title">Падежный ряд</div><div class="rowset">${table}</div><p class="keyline">И. — именительный, Р. — родительный, Д. — дательный, Т. — творительный, П. — предложный.</p><div class="actions" style="margin-top:22px"><button id="next" class="btn gold">${practicePos+1===practiceSeq.length?'Посмотреть итог':'Следующая карточка →'}</button></div></div>`;
  for(const node of document.querySelectorAll('select,input[type=radio]')) node.disabled=true;
  document.querySelector('#check').disabled=true;
  document.querySelector('#next').onclick=()=>{practicePos++; a={p:'',n:'',type:'',role:'',write:''}; drawPractice();};
  document.querySelector('#feedback').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function practiceEnd(){
  const total=Object.keys(state.practice.done).length;
  const errs=state.practice.errors.length;
  const excellent=Object.values(state.practice.done).filter(x=>x.success).length;
  app.innerHTML=`<section class="page"><div class="top"><strong class="count">Проработка завершена</strong><button class="btn alt tiny" id="homeBtn">На главную</button></div><div class="result-n">${total}<span style="font-size:1.1rem;color:var(--muted);font-weight:700"> из 20</span></div><p>Теперь ученик проходит цепочку именно в нужном порядке: <b>связь → вывод о существительном → написание НЕ</b>.</p><div class="result-cards"><span>Верно: ${excellent}</span><span>Осталось повторить: ${errs}</span></div><div class="actions">${errs?'<button class="btn" id="again">Повторить ошибки</button>':''}<button class="btn gold" id="restartAllPractice">Все 20 заново</button></div></section>`;
  document.querySelector('#homeBtn').onclick=home;
  const ag=document.querySelector('#again'); if(ag) ag.onclick=()=>{review=true; practiceSeq=[...state.practice.errors]; practicePos=0; a={p:'',n:'',type:'',role:'',write:''}; drawPractice();};
  document.querySelector('#restartAllPractice').onclick=()=>{if(confirm('Снова пройти все 20 карточек?')){state.practice={done:{},errors:[]};save();review=false;practiceSeq=D.map(x=>x.id);practicePos=0;a={p:'',n:'',type:'',role:'',write:''};drawPractice();}};
}
home();
})();
</script>
</body>
</html>
