<style>

.hero{background:#fbf9fd;border:1px solid #ede2f0;border-radius:22px;text-align:center;padding:16px 17px 19px}

.part-chip{background:#d9f4eb;color:#056e69}.noun-chip{background:#fff0bf;color:#80510b}

.pile{margin-top:12px;display:flex;flex-direction:column;gap:8px}

.pile-card .solved{font-size:.98rem}
.pile-card.good{box-shadow:inset 0 0 0 2px #d6efe6}.pile-card.bad{box-shadow:inset 0 0 0 2px #f3d7dd}
.pile-tag{font-size:.75rem;font-weight:900;letter-spacing:.04em;text-transform:uppercase;padding:4px 8px;border-radius:999px;background:#f3eff5;color:#6d5679}
.errors-board{margin-top:18px;display:grid;gap:12px}.error-card{background:#fff;border:2px solid #eac7cc;border-radius:19px;padding:16px}.error-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;color:var(--plum);font-weight:900}.error-before{font-size:1.04rem;font-weight:850;background:#faf8fb;border-radius:13px;padding:10px 13px;margin:8px 0}.error-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.error-cell{border-radius:13px;padding:12px 14px;background:#fff0f2;border:1px solid #efcbd2}.error-cell.correct{background:#eaf8f1;border-color:#b6e1d0}.error-cell .minor{font-size:.8rem;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.02em}.error-cell b{display:block;margin-top:3px;font-size:1.08rem}.errors-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}.summary-box{background:linear-gradient(112deg,#f2fbf7,#fff9eb);border:1px solid #d9ebdf;border-radius:18px;padding:18px;margin-top:18px}
.summary-box h2{margin:0 0 8px;color:var(--plum)}
.summary-box p{margin:5px 0;font-size:1.04rem}
.arrow-go{font-size:1.2rem;padding-inline:18px}
.lab{background:linear-gradient(125deg,#f8fffc,#fffaf0);border:2px solid #e4e3d8;border-radius:21px;padding:18px}
.lab-header{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:13px}.lab-header b{font-size:1rem}.lab-header span{font-size:.84rem;color:var(--muted)}
.selectors{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:end}
.slot{border-radius:16px;padding:12px;min-width:0}.slot.part-slot{background:var(--mint);border:1px solid #afdfd5}.slot.noun-slot{background:var(--honey);border:1px solid #f1d491}
.slot label{display:block;font-size:.89rem;font-weight:850;margin:0 0 9px}.slot.part-slot label{color:#005f5c}.slot.noun-slot label{color:#7e4d04}
.slot select{appearance:auto;width:100%;min-width:0;min-height:53px;padding:9px 12px;background:#fff;border:2px solid #dcd8d8;border-radius:11px;color:#24212b;font-size:clamp(1rem,2.1vw,1.16rem);font-weight:850;cursor:pointer}
.slot select:disabled{background:#faf9f6;color:#999;cursor:default}.slot select:not(:disabled):focus{border-color:#d69a40}
.compare{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:7px;margin-top:15px}

.compare .label-sm{font-size:.75rem;letter-spacing:.04em;font-weight:800;color:#817783;text-transform:uppercase}
.compare .phrase-compare{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px;font-weight:800;font-size:clamp(.95rem,2.2vw,1.22rem)}
.compare .arrow{font-size:2rem;font-weight:900;color:#aa80ae}.part-txt{color:var(--teal-dark)}.noun-txt{color:#8e590f}.placeholder{color:#b2a5ad}
.mini-rule{display:flex;gap:9px;align-items:center;margin-top:14px;font-size:.88rem;color:#655c66}.mini-rule .dot{height:12px;width:12px;border-radius:50%;background:var(--teal);box-shadow:18px 0 0 #e0a749;margin-right:21px;flex-shrink:0}
.conclusion{margin-top:22px}.subq{display:flex;justify-content:space-between;align-items:center;gap:9px;flex-wrap:wrap;font-weight:850;margin:15px 0 8px}.subq .tag{background:#f0edf3;border-radius:100px;color:#584464;font-size:.73rem;padding:3px 9px;font-weight:850;letter-spacing:.02em}
.choice-row{display:flex;flex-wrap:wrap;gap:8px}.choice{position:relative}.choice input{position:absolute;opacity:0;pointer-events:none}
.choice label{display:inline-block;padding:10px 17px;min-height:44px;border:2px solid #ddd5df;border-radius:999px;background:#fff;font-weight:800;cursor:pointer;transition:background .12s,border-color .12s}
.choice input:checked+label{background:#e4f6f0;color:#00645d;border-color:#06a194;box-shadow:0 0 0 2px #e4f6f0}.choice input:disabled+label{opacity:.45;cursor:not-allowed}
.choice.emph input:checked+label{background:#fff2d5;color:#794e16;border-color:#d6a54c;box-shadow:0 0 0 2px #fff2d5}
.choice.plum input:checked+label{background:#f2ebf4;color:#573d63;border-color:#a88ab5;box-shadow:0 0 0 2px #f2ebf4}
.side-soft{border:1px solid #eee7f0;background:#fbfafc;border-radius:15px;padding:14px}.side-soft .subq{margin:0 0 9px}
.btnbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:24px;padding-top:20px;border-top:1px dashed #ddd7dc}
.feedback{margin-top:21px;border-top:2px solid #eee9ee;padding-top:22px}.feedback h2{color:var(--plum);font-size:1.34rem;margin:0 0 14px}
.feedback-summary{background:linear-gradient(110deg,#f0fbf6,#fffaeb);border:1px solid #cce9da;padding:16px;border-radius:17px}
.feedback-summary h3{margin:0 0 8px;font-size:1.3rem}.feedback-summary p{margin:5px 0;font-size:1.02rem}
.verdict{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}.verdict .pill{border-radius:12px;background:#fff;border:1px solid #dfdfda;padding:8px 12px;font-weight:800}
.checklist{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:15px 0}.check{padding:11px 13px;border-radius:13px;font-size:.94rem;border:1px solid #e4dfe4;background:#f9f8f9}.check.correct{background:#ecf9f1;border-color:#a8dcc7}.check.incorrect{background:#fff0f2;border-color:#efbfc9}.check b{display:block}
.review-title{font-size:.99rem;font-weight:900;margin:16px 0 8px}.case-row{display:flex;align-items:center;flex-wrap:wrap;gap:9px;padding:8px 10px;border-bottom:1px solid #e8e4e7}.case-row:last-child{border-bottom:0}
.case-mark{width:29px;height:29px;background:#f1eaf2;color:#5a4564;border-radius:10px;font-weight:900;text-align:center;line-height:29px;flex:0 0 auto;font-size:.84rem}
.case-word{font-size:clamp(.94rem,2.2vw,1.08rem);font-weight:850}.case-word .p{color:var(--teal-dark)}.case-word .n{color:#8f5b11}.case-row .preposition{color:#5e5362}.rowset{border:1px solid #e8e2e8;border-radius:13px;overflow:hidden}.keyline{font-size:.91rem;color:var(--muted);margin:10px 0}
.result-n{font-size:clamp(3rem,7vw,4.5rem);font-weight:950;color:var(--teal);line-height:1.2}.result-cards{display:flex;flex-wrap:wrap;gap:11px}.result-cards span{padding:10px 14px;background:#f6f4f6;border:1px solid #e8e2e8;border-radius:13px;font-weight:780}
.reset-hint{margin-top:18px;font-size:.86rem;color:var(--muted)}footer{text-align:center;font-size:.79rem;color:#77707e;margin:0 auto 20px;padding:0 16px;max-width:850px}
@media(max-width:860px){.sorter-current{grid-template-columns:1fr}.dropzones,.checklist,.error-grid{grid-template-columns:1fr}}
@media(max-width:700px){main{padding:0 11px;margin:14px auto 36px}.page{padding:16px}.intro-grid{grid-template-columns:1fr}.selectors{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:7px}.slot{padding:8px}.slot select{font-size:.88rem;padding:8px 5px;min-height:48px}.compare{grid-template-columns:1fr}.compare .arrow{transform:rotate(90deg)}.btnbar{flex-direction:column;align-items:stretch}.drop-btns{flex-direction:column}.sort-choice{flex:0 0 auto;width:100%;min-height:56px}}

/* Версия 7 · выразительные рамки, контрастные цвета, два списка рядом */
:root{
  --plum:#412349;--plum-deep:#291330;--teal:#087d73;--teal-dark:#005e55;
  --mint:#d7f6ec;--honey:#ffedb3;--amber:#b46c0a;--coral:#b83f59;
  --bg:#f4f5ef;--shadow:0 12px 0 #3822420b;
}
body{background:radial-gradient(circle at 12% 0%,#e6faf4 0,transparent 26%),radial-gradient(circle at 88% 3%,#fff0cd 0,transparent 26%),#f4f5ef}
header{border-bottom:5px solid #efba55;background:radial-gradient(circle at 92% -25%,#946488 0,transparent 32%),linear-gradient(115deg,#2c1536,#52305b)}
.page{border:2px solid #e7dce8;box-shadow:0 12px 0 #3822420b,0 18px 35px #3822420a}
.hero{background:linear-gradient(120deg,#eee4f5,#fff7de);border:2px solid #cdb6d5;box-shadow:inset 0 0 0 3px #ffffffad}
.hero .eyebrow{color:#694674;font-weight:900;text-transform:uppercase;letter-spacing:.04em}
.part-chip{background:#8be0cf;color:#064b46;border:2px solid #36b8a6}
.noun-chip{background:#ffdc86;color:#6d4406;border:2px solid #f3bd55}
.section-label{font-size:clamp(1.15rem,2.2vw,1.47rem);color:#3b1d47;line-height:1.24;padding-left:14px;border-left:7px solid #17a98d;margin:26px 0 15px}
.lab{background:linear-gradient(125deg,#f1fff8 0%,#fff2cb 100%);border:3px solid #d3b7d7;box-shadow:7px 7px 0 #d7efe7;padding:20px}
.lab-header{padding:7px 12px;margin-bottom:15px;border-radius:13px;background:#56305c;color:#fff}
.lab-header b{font-size:1.09rem}
.lab-header span{color:#ffe4ad;font-weight:700}
.selectors{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:stretch}
.slot{padding:15px;border-radius:18px;display:flex;flex-direction:column;min-width:0}
.slot.part-slot{border:3px solid #26b49f;background:linear-gradient(135deg,#d6f7e9,#f0fffa);box-shadow:4px 4px 0 #a2e6d7}
.slot.noun-slot{border:3px solid #e7ac31;background:linear-gradient(135deg,#ffebae,#fff8e1);box-shadow:4px 4px 0 #f2d28c}
.slot label{font-size:clamp(.91rem,1.8vw,1.04rem);line-height:1.28;min-height:2.6em;font-weight:900;display:flex;align-items:center;margin:0 0 10px}
.slot select{border:2px solid #b2a6b0;min-height:57px;box-shadow:0 3px 0 #27183312;background-color:white;color:#2a2031;font-weight:900}
.slot select:disabled{color:#827683;background:#f5f2f2}
.slot.part-slot select:not(:disabled):focus{border-color:#008b7b}
.slot.noun-slot select:not(:disabled):focus{border-color:#c88717}
.compare{gap:12px;margin-top:20px}
.compare .comparison{border:2px solid #e0d3df;background:#fff;border-radius:17px;min-height:96px;padding:12px}
.compare .comparison:first-child{border-left:7px solid #17a98d}
.compare .comparison:last-child{border-left:7px solid #dfa431}
.compare .label-sm{color:#64466e;font-size:.82rem}
.compare .arrow{color:#a04fa0}
.mini-rule{color:#46384c;font-size:.97rem;font-weight:650}
.conclusion .side-soft{background:#f7f2fb;border:2px solid #cbb4d3;box-shadow:4px 4px 0 #ebdcf0}
.conclusion .side-soft:nth-child(2){background:#fff8e5;border-color:#e6ba61;box-shadow:4px 4px 0 #f6e3ad}
.conclusion .side-soft:nth-child(3){background:#e9faf4;border-color:#79c7b7;box-shadow:4px 4px 0 #c9f0e5}
.conclusion .subq{font-size:1.03rem;color:#3c2645}
.choice label{border-width:2px}
.feedback-summary{background:linear-gradient(120deg,#dbf8ef,#fff2cb);border:2px solid #95cfc0}
.dropzone.left{background:#eafbF5;border-color:#3daf9d;box-shadow:4px 4px 0 #cbeee4}
.dropzone.right{background:#fff4d1;border-color:#edbc52;box-shadow:4px 4px 0 #fae5af}
.sorter-card{background:linear-gradient(110deg,#f4eafa,#fff3df);border:2px dashed #b88ac3}
.sorter-stage{border-color:#cbadd4;background:linear-gradient(115deg,#f5fffb,#fff4d9)}
.sorter-help{background:#f4eaf8;border-color:#d4b8dd}
@media(max-width:700px){
  .selectors{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px}
  .lab{padding:12px;box-shadow:3px 3px 0 #d7efe7}
  .slot{padding:9px}
  .slot label{font-size:.82rem;min-height:4.35em;align-items:start}
  .slot select{font-size:.86rem;padding:8px 4px;min-height:53px}
  .compare{grid-template-columns:1fr auto 1fr;gap:4px}
  .compare .arrow{transform:none;font-size:1.4rem}
  .compare .comparison{min-height:105px;padding:10px 5px}
  .compare .phrase-compare{font-size:.95rem}
  .lab-header span{font-size:.74rem}
}
@media(max-width:390px){
  .slot label{font-size:.76rem;min-height:5em}
  .slot select{font-size:.77rem}
}


/* Immediate, non-spoiling validation of the noun form. */
.slot.noun-slot.noun-mistake{border-color:#e24b62!important;background:linear-gradient(125deg,#ffe4e9,#fff1e7)!important;box-shadow:0 0 0 4px #ffb8c6,0 0 28px rgba(220,48,85,.38)!important;animation:nounAlert .8s ease-in-out 3 alternate}
.slot.noun-slot.noun-mistake select{border-color:#d63957!important;background:#fff8fa;color:#8c1732}
@keyframes nounAlert {from{box-shadow:0 0 0 3px #f5a0b4,0 0 12px rgba(211,46,84,.24)}to{box-shadow:0 0 0 6px #fbc5d0,0 0 35px rgba(211,46,84,.48)}}
@media(prefers-reduced-motion:reduce){.slot.noun-slot.noun-mistake{animation:none}}
.instant-form-note{margin-top:14px;border:2px solid #e45c73;border-left:8px solid #d93656;background:#fff1f4;border-radius:16px;padding:13px 16px;color:#89213d;font-weight:750}
.instant-form-note p{margin:6px 0 10px;font-size:.95rem}
.instant-form-note .btn{background:#fff;color:#7d2a42;border-color:#e8a1b0}
.context-bridge{margin-top:12px;background:linear-gradient(112deg,#f3edf9,#e7faf2);border:2px solid #ad9ac1;border-radius:18px;padding:15px}
.context-bridge h3{margin:0 0 11px;color:#492b59;font-size:1.05rem}
.context-lines{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.context-lines>div{border-radius:12px;padding:12px;border:2px solid #d8cadd;background:#fff}
.context-lines>div:last-child{border-color:#a6d8c6}
.context-lines .context-tag{font-size:.72rem;color:#705c79;font-weight:900;text-transform:uppercase;letter-spacing:.04em}

<body>
<header>
  <div class="sup">ОРФОГРАФИЧЕСКАЯ ЛАБОРАТОРИЯ</div>
  <h1>Кто здесь главный?</h1>
  <p>Два режима на выбор: быстрый сортер или подробная падежная тренировка.</p>
</header>
<main id="app"></main>
<footer>Тренажёр показывает, как по поведению существительного отличить зависимое слово от определяемого и выбрать написание НЕ с причастием.</footer>
<script>
(()=>{
const D=[
{id:1,mode:'u',p:['сдавший','сдавшего','сдавшему','сдавшим','сдавшем'],n:['экзамен','экзамена','экзамену','экзаменом','экзамене'],fixed:0,q:'сдавший (что?) экзамен'},
{id:2,mode:'s',p:['полученные','полученных','полученным','полученными','полученных'],n:['награды','наград','наградам','наградами','наградах'],q:'награды (какие?) полученные'},
{id:3,mode:'u',p:['досмотревший','досмотревшего','досмотревшему','досмотревшим','досмотревшем'],n:['фильм','фильма','фильму','фильмом','фильме'],fixed:0,q:'досмотревший (что?) фильм'},
{id:4,mode:'u',p:['выполнившие','выполнивших','выполнившим','выполнившими','выполнивших'],n:['задания','заданий','заданиям','заданиями','заданиях'],fixed:0,q:'выполнившие (что?) задания'},
{id:5,mode:'s',p:['сдавший','сдавшего','сдавшему','сдавшим','сдавшем'],n:['студент','студента','студенту','студентом','студенте'],q:'студент (какой?) сдавший'},
{id:6,mode:'s',p:['выбранный','выбранного','выбранному','выбранным','выбранном'],n:['подарок','подарка','подарку','подарком','подарке'],q:'подарок (какой?) выбранный'},
{id:7,mode:'u',p:['получившие','получивших','получившим','получившими','получивших'],n:['награды','наград','наградам','наградами','наградах'],fixed:0,q:'получившие (что?) награды'},
{id:8,mode:'s',p:['работающий','работающего','работающему','работающим','работающем'],n:['механизм','механизма','механизму','механизмом','механизме'],q:'механизм (какой?) работающий'},
{id:9,mode:'u',p:['выбравший','выбравшего','выбравшему','выбравшим','выбравшем'],n:['подарок','подарка','подарку','подарком','подарке'],fixed:0,q:'выбравший (что?) подарок'},
{id:10,mode:'s',p:['читаемый','читаемого','читаемому','читаемым','читаемом'],n:['журнал','журнала','журналу','журналом','журнале'],q:'журнал (какой?) читаемый'},
{id:11,mode:'u',p:['выполняющий','выполняющего','выполняющему','выполняющим','выполняющем'],n:['план','плана','плану','планом','плане'],fixed:0,q:'выполняющий (что?) план'},
{id:12,mode:'s',p:['выполненные','выполненных','выполненным','выполненными','выполненных'],n:['задания','заданий','заданиям','заданиями','заданиях'],q:'задания (какие?) выполненные'},
{id:13,mode:'s',p:['решённый','решённого','решённому','решённым','решённом'],n:['пример','примера','примеру','примером','примере'],q:'пример (какой?) решённый'},
{id:14,mode:'u',p:['заполнившие','заполнивших','заполнившим','заполнившими','заполнивших'],n:['анкеты','анкет','анкетам','анкетами','анкетах'],fixed:0,q:'заполнившие (что?) анкеты'},
{id:15,mode:'s',p:['купленный','купленного','купленному','купленным','купленном'],n:['подарок','подарка','подарку','подарком','подарке'],q:'подарок (какой?) купленный'},
{id:16,mode:'u',p:['подписавший','подписавшего','подписавшему','подписавшим','подписавшем'],n:['договор','договора','договору','договором','договоре'],fixed:0,q:'подписавший (что?) договор'},
{id:17,mode:'s',p:['отправленные','отправленных','отправленным','отправленными','отправленных'],n:['письма','писем','письмам','письмами','письмах'],q:'письма (какие?) отправленные'},
{id:18,mode:'u',p:['отправившие','отправивших','отправившим','отправившими','отправивших'],n:['письма','писем','письмам','письмами','письмах'],fixed:0,q:'отправившие (что?) письма'},
{id:19,mode:'u',p:['решивший','решившего','решившему','решившим','решившем'],n:['пример','примера','примеру','примером','примере'],fixed:0,q:'решивший (что?) пример'},
{id:20,mode:'s',p:['пришедшие','пришедших','пришедшим','пришедшими','пришедших'],n:['гости','гостей','гостям','гостями','гостях'],q:'гости (какие?) пришедшие'}
];
const ABSURD_QUESTIONS={
  1:'Экзамен, который чего-то не сдал? А что именно мог сдать сам экзамен?',
  3:'Фильм, который чего-то не досмотрел? Что мог бы смотреть сам фильм?',
  4:'Задания, которые чего-то не выполнили? Что могли выполнить сами задания?',
  7:'Награды, которые ничего не получили? Что могли получить сами награды?',
  9:'Подарок, который ничего не выбрал? Что мог бы выбрать сам подарок?',
  11:'План, который ничего не выполняет? Что мог бы выполнять сам план?',
  14:'Анкеты, которые ничего не заполнили? Что могли заполнить сами анкеты?',
  16:'Договор, который ничего не подписал? Что мог подписать сам договор?',
  18:'Письма, которые ничего не отправили? Что могли отправить сами письма?',
  19:'Пример, который ничего не решил? Что мог решить сам пример?'
};
const CASES=['И.','Р.','Д.','Т.','П.'];
const KEY='participle-head-noun-lab-v13';
const app=document.querySelector('#app');
const load=()=>{try{const o=JSON.parse(localStorage.getItem(KEY));if(o)return o}catch(e){}return {sorter:{done:false,index:0,left:[],right:[],errors:[]},practice:{done:{},errors:[]}}};
let state=load();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
const noun=(d,i)=>d.n[d.mode==='u'?d.fixed:i];
const part=(d,i)=>`${i===4?'о ':''}(не)${d.p[i]}`;
const answerPart=(d,i)=>`${i===4?'о ':''}${d.mode==='u'?'не ': 'не'}${d.p[i]}`;
const formatted=(d,i,solved=false)=>`${solved?answerPart(d,i):part(d,i)} ${noun(d,i)}`;
const currentSorter=()=>D[state.sorter.index]||null;
let practiceSeq=D.map(x=>x.id), practicePos=0, review=false, a={};
const emptyAnswer=()=>({p:'',n:'',type:'',role:'',write:'',hadNounMistake:false,sentence:'',subjectGuess:'',subjectChecked:false,marks:{},markMode:'subject',sentenceExpanded:false,insightApplied:false});
const escapeHTML=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const currentPractice=()=>D.find(d=>d.id===practiceSeq[practicePos]);
// Показываем слова отдельными кликабельными элементами. Никакой автоматической
// синтаксической проверки развернутого предложения здесь нет.
function sentenceTokens(sentence){return sentence.match(/\p{L}+(?:[-’']\p{L}+)*|\d+|[^\p{L}\d\s]+|\s+/gu)||[];}
function markupHTML(){
  if(!a.sentence.trim())return '<span class="placeholder">Здесь появятся слова написанного предложения.</span>';
  return sentenceTokens(a.sentence).map((tok,i)=>{
    if(!/^[\p{L}\d]/u.test(tok)) return escapeHTML(tok);
    const mark=a.marks[i]||'';
    return `<button class="mark-word ${mark}" type="button" data-word-index="${i}" aria-pressed="${!!mark}" title="Выделить слово как ${a.markMode==='subject'?'подлежащее':'сказуемое'}">${escapeHTML(tok)}</button>`;
  }).join('');
}

function radio(name,options,disabled=false,cls=''){return `<div class="choice-row" role="group">${options.map(([key,label])=>`<div class="choice ${cls}"><input type="radio" name="${name}" id="${name}-${key}" value="${key}" ${a[name]===key?'checked':''} ${disabled?'disabled':''}><label for="${name}-${key}">${label}</label></div>`).join('')}</div>`}
function home(){
  const errCount=state.sorter.errors.length;
  const practiceDone=Object.keys(state.practice.done).length;
  const practiceLabel=practiceDone===20?'Пройти тренировку заново':practiceDone>0?'Продолжить тренировку':'Сразу к тренировке';
  app.innerHTML=`<section class="page">
    <div class="top"><strong class="count">Выбери, с чего начать</strong>${(state.sorter.done||practiceDone>0)?'<button class="btn danger tiny" id="resetAll">Сбросить всё</button>':''}</div>
    <p class="lead">Рекомендуем сначала пройти <b>сортер</b> из 20 словосочетаний, а затем — при желании — <b>падежную тренировку</b>. Но можно сразу начать с тренировки, ничего не распределяя.</p>
    <div class="mode-grid">
      <div class="mode-card sort-mode">
        <span class="mode-kicker">Быстрая проверка · 20 карточек</span>
        <h2>Сортер</h2>
        <p>Распредели словосочетания: <b>нет зависимого слова — слитно</b>; <b>есть зависимое слово — раздельно</b>. После прохождения можно посмотреть ошибки.</p>
        <button class="btn" id="startSorter">${state.sorter.done?'Пройти сортер ещё раз':'Пройти сортер →'}</button>
      </div>
      <div class="mode-card train-mode">
        <span class="mode-kicker">Подробная работа · 20 карточек</span>
        <h2>Падежная тренировка</h2>
        <p>Проверь, согласуется причастие с существительным или управляет им: измени падеж, определи связь и выбери написание НЕ.</p>
        <button class="btn gold" id="startPracticeDirect">${practiceLabel} →</button>
      </div>
    </div>
    ${state.sorter.done?`<div class="summary-box"><h2>Результат сортера</h2><p>Ошибок: <b>${errCount}</b>. ${errCount===0?'Отлично, ошибок не было.':'Можно посмотреть, какие карточки вызвали затруднения.'}</p><p><b>Рекомендация:</b> ${errCount?'пройти падежную тренировку, чтобы разобраться в связях слов.':'для закрепления можно пройти тренировку, но это необязательно.'}</p><div class="actions">${errCount?'<button class="btn alt" id="seeErrors">Посмотреть ошибки</button>':''}<button class="btn gold" id="recommendPractice">${practiceDone>0?'К тренировке':'Перейти к тренировке'} →</button></div></div>`:''}
    ${practiceDone>0?`<p class="hint">В тренировке пройдено ${practiceDone} из 20 карточек. Можно продолжить с первой непройденной.</p>`:''}
  </section>`;
  const reset=document.querySelector('#resetAll');if(reset) reset.onclick=resetAll;

  const right={n:noun(d,i),type:d.mode,role:d.mode==='u'?'dependent':'main',write:d.mode==='u'?'apart':'together'};
  const checks=[
    {k:'n',ok:a.n===right.n,label:'Форма существительного',right:right.n},
    {k:'type',ok:a.type===right.type,label:'Тип связи',right:d.mode==='u'?'управление':'согласование'},
    {k:'role',ok:a.role===right.role,label:'Вывод о существительном',right:d.mode==='u'?'зависимое от причастия слово':'определяемое слово'},
    {k:'write',ok:a.write===right.write,label:'Написание НЕ',right:d.mode==='u'?'раздельно':'слитно'}
  ];
  const success=checks.every(x=>x.ok);
  const noMistakeFirstTry=success && !a.hadNounMistake;
  if(!state.practice.done[d.id]) state.practice.done[d.id]={success:noMistakeFirstTry};
  else state.practice.done[d.id].success=noMistakeFirstTry;
  if(!noMistakeFirstTry && !state.practice.errors.includes(d.id)) state.practice.errors.push(d.id);
  if(noMistakeFirstTry) state.practice.errors=state.practice.errors.filter(id=>id!==d.id);
  save();
  box.innerHTML=`<div class="status ${success?'good':'bad'}">${success?'✓ Теперь верно!':'Есть неточности.'} ${success?(a.hadNounMistake?'Форму существительного исправили. Эта карточка попадёт в повторение.':'Цепочка рассуждения собрана правильно.'):'Смотри объяснение ниже: оно покажет, что произошло с существительным.'}</div>`;
  const changed=d.mode==='s';
  const typeName=changed?'Согласование':'Управление';
  const roleText=changed?'определяемое слово':'зависимое от причастия слово';
  let table='';
  for(let j=0;j<5;j++) table+=`<div class="case-row"><span class="case-mark">${CASES[j]}</span><span class="case-word"><span class="preposition">${j===4?'о ':''}</span><span class="p">${d.mode==='u'?'не ':'не'}${d.p[j]}</span> <span class="n">${noun(d,j)}</span></span></div>`;
  document.querySelector('#feedback').innerHTML=`<div class="feedback"><h2>Разгадка</h2><div class="feedback-summary"><h3>${changed?'↗ Согласование':'🔒 Управление'}</h3><p>${changed?`Существительное меняется вместе с причастием: <b>${noun(d,0)} → ${noun(d,i)}</b>. <b>Существительное главное</b>, причастие с ним согласуется.`:`Причастие изменило падеж, а существительное сохранило прежнюю форму: <b>${noun(d,0)} → ${noun(d,i)}</b>. <b>Причастие главное</b>, существительное зависит от него и остаётся в винительном падеже.`}</p><div class="verdict"><span class="pill">${typeName}</span><span class="pill">Существительное — ${roleText}</span><span class="pill">НЕ пишем ${changed?'слитно':'раздельно'}</span></div><p><b>Итог:</b> ${formatted(d,0,true)}.</p></div><div class="checklist">${checks.map(x=>`<div class="check ${x.ok?'correct':'incorrect'}"><b>${x.ok?'✓':'✕'} ${x.label}</b>${x.ok?'Верно':'Правильно: '+x.right}</div>`).join('')}</div><div class="review-title">Падежный ряд</div><div class="rowset">${table}</div><p class="keyline">И. — именительный, Р. — родительный, Д. — дательный, Т. — творительный, П. — предложный.</p><div class="actions" style="margin-top:22px"><button id="next" class="btn gold">${practicePos+1===practiceSeq.length?'Посмотреть итог':'Следующая карточка →'}</button></div></div>`;
  for(const node of document.querySelectorAll('select,input[type=radio]')) node.disabled=true;
  document.querySelector('#check').disabled=true;
  document.querySelector('#next').onclick=()=>{practicePos++; a=emptyAnswer(); drawPractice();};
  document.querySelector('#feedback').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function practiceEnd(){
  const total=Object.keys(state.practice.done).length;
  const errs=state.practice.errors.length;
  const excellent=Object.values(state.practice.done).filter(x=>x.success).length;
  app.innerHTML=`<section class="page"><div class="top"><strong class="count">Проработка завершена</strong><button class="btn alt tiny" id="homeBtn">На главную</button></div><div class="result-n">${total}<span style="font-size:1.1rem;color:var(--muted);font-weight:700"> из 20</span></div><p>Теперь ученик проходит цепочку именно в нужном порядке: <b>связь → вывод о существительном → написание НЕ</b>.</p><div class="result-cards"><span>Верно: ${excellent}</span><span>Осталось повторить: ${errs}</span></div><div class="actions">${errs?'<button class="btn" id="again">Повторить ошибки</button>':''}<button class="btn gold" id="restartAllPractice">Все 20 заново</button></div></section>`;
  document.querySelector('#homeBtn').onclick=home;
  const ag=document.querySelector('#again'); if(ag) ag.onclick=()=>{review=true; practiceSeq=[...state.practice.errors]; practicePos=0; a=emptyAnswer(); drawPractice();};
  document.querySelector('#restartAllPractice').onclick=()=>{if(confirm('Снова пройти все 20 карточек?')){state.practice={done:{},errors:[]};save();review=false;practiceSeq=D.map(x=>x.id);practicePos=0;a=emptyAnswer();drawPractice();}};
}
home();
})();
</script>
</body>
</html>
